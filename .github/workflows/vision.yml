name: Bridge and browser vision
on:
  pull_request:
  push:
    branches: [main, codex/browser-vision-stage1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --frozen --extra dev
      - run: npm run verify
